Builds:
  - versionName: '0.9.0'
    versionCode: 9000
    commit: master
    subdir: android
    gradle: yes
    sudo:
      - 'apt-get update && apt-get install -y rustup'
      - 'rustup target add wasm32-unknown-unknown'
    prebuild:
      - 'cd ../rust/pczt_signing && cargo build --target wasm32-unknown-unknown --release --locked'
      - 'cp ../rust/pczt_signing/target/wasm32-unknown-unknown/release/pczt_signing.wasm src/main/assets/modules/module0.wasm'

AutoUpdateMode: Version
UpdateCheckMode: Tags

AllowedAPKSigningKeys: null

RequiresRoot: false

MaintainerNotes: |
  This is a complex Rust+Kotlin+WebAssembly build. The app compiles Rust to both:
  1. Native Android library (ARM/ARM64/x86_64) via rust-android-gradle
  2. WebAssembly module for PCZT signing (runs in wasmi sandbox on device)

  The wasm32 build step must happen before gradle assembles the APK. The Cargo.lock
  is committed, enabling reproducible builds.

  All Rust git dependencies (frost-spend, substrate, penumbra) point to specific
  commits/tags in public repositories and should remain available.

  The app targets minSdk 23 but runs best on Android 12+ (NU6.3 Zcash support).
  Pixel 8+ with StrongBox secure element recommended for maximum key protection.
