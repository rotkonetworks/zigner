name: "Install iOS Dependencies"
description: "Sets up xcode, rust, etc."

runs:
  using: "composite"
  steps:
    - name: Setup Ruby
      uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
      with:
        ruby-version: "3.3"
        bundler-cache: false
    - name: Setup - Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
      with:
        xcode-version: 16

    - name: Install dependencies
      shell: bash
      run: |
        brew install sourcery
        bundle install
        cat Gemfile.lock

    - name: Get cached Swift Packages managed by Xcode
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Install Rust targets
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
      with:
        toolchain: 1.99.1
        targets: x86_64-apple-ios,aarch64-apple-ios
        components: rust-std

    - name: Install uniffi_bindgen
      uses: actions-rs/install@9da1d2adcfe5e7c16992e8242ca33a56b6d9b101 # v0.1
      with:
        crate: uniffi_bindgen
        version: 0.22.0 # Must be in sync with version in Cargo.toml
        use-tool-cache: true

    - name: Rust Cache
      uses: Swatinem/rust-cache@27b8ea9368cf428f0bfe41b0876b1a7e809d9844 # v2.7.7
      with:
        workspaces: rust -> rust/target
