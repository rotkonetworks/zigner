[package]
name = "pczt_signing"
version = "0.1.0"
edition = "2021"
description = "Keystone-compatible PCZT Signer role for zigner: redacted PCZT in, signed PCZT out"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

# Standalone on purpose: the zigner workspace is resolver=1 with an older
# zcash stack (orchard 0.10 via frost-spend). This crate tracks the released
# crates.io stack (pczt 0.9.3 / orchard 0.15 / zcash_primitives 0.30), which
# ships Ironwood (NU6.3 / V6) UNGATED - no `zcash_unstable` cfg is required
# any more. Fold into the workspace when the legacy crates migrate.
[workspace]

[dependencies]
pczt = { version = "0.9.3", default-features = false, features = ["orchard", "transparent", "signer"] }
zcash_keys = { version = "0.16.1", default-features = false, features = ["orchard", "transparent-inputs"] }
zcash_protocol = { version = "0.10.4", default-features = false }
zcash_primitives = { version = "0.30", default-features = false, features = ["transparent-inputs"] }
orchard = { version = "0.15", default-features = false }
zip32 = { version = "0.2", default-features = false }
zcash_transparent = { version = "0.10", package = "zcash_transparent", default-features = false, features = ["transparent-inputs"] }
bip39 = "2"
sha2 = { version = "0.10", default-features = false }
# pczt's signer role uses rand_core::OsRng; the flag arrives via feature
# unification in bigger graphs - standalone we enable it explicitly
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
# The wallet-side half of the contract - Creator / IoFinalizer / Prover /
# Redactor / SpendFinalizer / TransactionExtractor - driven straight from the
# released `pczt` roles. (The previous `zafu-wasm` dev-dep is pinned to the
# 5333c01b librustzcash rev and cannot unify with the 0.9.2 stack; the roles
# it wrapped are the same upstream roles used directly here.)
pczt = { version = "0.9.3", default-features = false, features = ["orchard", "transparent", "signer", "io-finalizer", "zcp-builder", "prover", "tx-extractor", "spend-finalizer"] }
zcash_protocol = { version = "0.10.4", default-features = false, features = ["local-consensus"] }
orchard = { version = "0.15", default-features = false, features = ["circuit"] }
secp256k1 = "0.29"
# The kernel-side wasmi runtime, so the V6 round-trip test can drive the
# bundled module wasm through the EXACT runtime the Android device uses
# (ModuleRuntime::summarize_request / sign_request). module_host has no zcash
# deps (wasmi + rand_core + ed25519 + sha2), so it links cleanly here.
module_host = { path = "../module_host" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# wasmi module builds: randomness is a host capability. RedPallas signing
# is randomized, so the module imports entropy instead of pretending the
# sandbox has any.
getrandom = { version = "0.2", features = ["custom"] }
