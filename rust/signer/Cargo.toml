[package]
name = "signer"
version = "0.1.0"
authors = ["debris <marek.kotewicz@gmail.com>"]
edition = "2018"

[dependencies]
module_host = { path = "../module_host" }
anyhow = "1.0"
ffi-support = "0.4"
hex = "0.4.3"
uniffi = { version = "0.22.0" }
lazy_static = "1.4.0"
sled = "0.34"
serde_json = "1.0"
# UR (Uniform Resource) encoding for Keystone/Zashi compatibility
# see: https://github.com/BlockchainCommons/Research/blob/master/papers/bcr-2020-005-ur.md
ur = "0.4"
# SHA-256 for seed fingerprint
sha2 = "0.10"
# PCZT (Partially Created Zcash Transaction) for Zashi hardware wallet signing
# NU6.3 / Ironwood release stack. pczt 0.9.2 is the first crates.io release
# carrying the Ironwood (V6) pool UNGATED - no `zcash_unstable` cfg, no fork -
# so the shipped device can sign a V6 turnstile migration.
# Note: requires transparent feature due to the signer role referencing
# transparent types.
pczt = { version = "0.9.2", package = "pczt", default-features = false, features = ["signer", "orchard", "transparent"] }
zcash_transparent = { version = "0.10", package = "zcash_transparent", features = ["transparent-inputs"] }
# Orchard crate for SpendAuthorizingKey type - use same version as pczt
orchard = "0.15"
# Address encoding for PCZT recipient display
zcash_address = "0.13"
zcash_protocol = "0.10"
# gh #17 on-device FROST PCZT verify: recompute sighash (zcash_primitives) +
# OVK-decode outputs (zcash_note_encryption). Both already in the build graph
# transitively via pczt/orchard — direct deps add no new compilation.
zcash_primitives = "0.30"
zcash_note_encryption = "0.4"
# Auth identity derivation (HMAC-SHA512 KDF) and backup encryption
hmac = "0.12"
hkdf = "0.12"
# FROST multisig backup: PBKDF2-SHA512 + AES-GCM-256 (matches zafu @repo/encryption).
pbkdf2 = "0.12"
aes-gcm = "0.10"
base64 = { version = "0.22", default-features = false, features = ["std"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
# BIP39 mnemonic for hot wallet derivation
bip39 = { package = "tiny-bip39", version = "1.0.0", default-features = false }
chacha20poly1305 = "0.10"
zeroize = { version = "1.7", features = ["derive"] }
# Verified erasure-coded QR transport (zoda-vss)
zoda-vss = { workspace = true }

sp-runtime = { git = "https://github.com/paritytech/substrate", rev = "49734dd1d72a00b9d3b87ba397661a63e0e17af3", default-features = false }
sp-core = { git = "https://github.com/paritytech/substrate", rev = "49734dd1d72a00b9d3b87ba397661a63e0e17af3", default-features = false, features = ["full_crypto"] }

# FROST threshold multisig (shared crate from zcli)
frost-spend = { workspace = true }

constants = { path = "../constants" }
db_handling = { path = "../db_handling", default-features = false, features = ["active"] }
definitions = { path = "../definitions", default-features = false }
navigator = { path = "../navigator", default-features = false }
qr_reader_phone = { path = "../qr_reader_phone" }
transaction_parsing = { path = "../transaction_parsing", features = ["penumbra"] }
transaction_signing = { path = "../transaction_signing", features = ["penumbra", "zcash", "cosmos"] }
parser = { path = "../parser" }
qrcode_static = { path = "../qrcode_static" }

[target.'cfg(all(not(target_os = "android"), not(target_os = "ios")))'.dependencies]
env_logger = "0.10"

[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"
log = "0.4.21"

# Test-only: the wallet-side half of the PCZT contract, so the V5
# non-regression and V6/ironwood tests build REAL PCZTs and drive the shipped
# inspect/sign code over them. Dev-dependencies are not compiled for
# `cargo build`, so none of this reaches the Android artifact.
[dev-dependencies]
# Cross-library check: signatures this crate makes with sp_core must verify in
# the kernel verifier, which uses dalek's strict equation.
ed25519-dalek = "2"
pczt = { version = "0.9.2", package = "pczt", default-features = false, features = ["signer", "orchard", "transparent", "io-finalizer", "zcp-builder", "prover", "spend-finalizer", "tx-extractor"] }
zcash_protocol = { version = "0.10", features = ["local-consensus"] }
# Halo2 proving/verifying keys, so the round-trip test can finalize + extract a
# real V5 transaction from what the shipped signer produced.
orchard = { version = "0.15", features = ["circuit"] }


[build-dependencies]
definitions = {path = "../definitions"}
generate_message = {path = "../generate_message"}
uniffi_build = { version = "0.22.0", features = ["builtin-bindgen"] }

[lib]
crate-type = ["staticlib", "cdylib"]
