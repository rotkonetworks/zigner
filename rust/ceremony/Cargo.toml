[package]
name = "ceremony"
version = "0.1.0"
edition = "2021"
description = "zigner release ceremony coordinator: collects 2-of-3 signatures over a module manifest"
license = "GPL-3.0-only"

# Standalone, not a zigner workspace member: this is a server and has no
# business pulling tokio and axum into the dependency graph that cross-compiles
# for Android.
[workspace]

[dependencies]
module_host = { path = "../module_host" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
hex = "0.4"
sha2 = { version = "0.10", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
