[package]
name = "zcash-wasm"
version = "0.1.0"
edition = "2021"
description = "minimal zcash orchard key derivation for wasm"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# wasm bindings
wasm-bindgen = "0.2"
js-sys = "0.3"

# zcash crypto - minimal set for derivation (no multicore for wasm)
orchard = { version = "0.10", default-features = false }
zip32 = "0.1"
bip32 = "0.5"
zcash_address = "0.6"

# utils
hex = "0.4"
zeroize = { version = "1.7", features = ["derive"] }

# wasm compat
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
