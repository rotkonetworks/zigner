[package]
name = "module_host"
version = "0.1.0"
edition = "2021"
description = "zigner kernel side: wasmi runtime + host API for protocol modules"
license = "MIT"

[dependencies]
wasmi = "0.38"
rand_core = { version = "0.6", features = ["getrandom"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false }
