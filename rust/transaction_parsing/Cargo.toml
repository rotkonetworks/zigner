[package]
name = "transaction_parsing"
version = "0.1.0"
authors = ["vera"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
definitions = {path = "../definitions", default-features = false }
thiserror = "1.0.57"
# penumbra dependencies
transaction_signing = { path = "../transaction_signing", optional = true, features = ["penumbra"] }

[features]
default = []
penumbra = ["transaction_signing"]

[lib]
name = "transaction_parsing"
crate-type = ["lib"]
